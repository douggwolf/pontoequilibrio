    <script>window.__FILES = {"src/App.tsx":"import { useEffect, useState } from \u0027react\u0027;\nimport BackgroundVideo from \u0027./components/BackgroundVideo\u0027;\nimport StressMarks from \u0027./components/StressMarks\u0027;\nimport Navbar from \u0027./components/Navbar\u0027;\nimport Hero from \u0027./components/Hero\u0027;\nimport Footer from \u0027./components/Footer\u0027;\nimport { PartIntro } from \u0027./components/ui\u0027;\nimport { PARTS } from \u0027./topics\u0027;\nimport { Overview } from \u0027./components/sections/Overview\u0027;\nimport { History, WhatIs } from \u0027./components/sections/Basics\u0027;\nimport { Behavior, Climate, Culture } from \u0027./components/sections/Culture\u0027;\nimport { Burnout, WorkIllness } from \u0027./components/sections/Health\u0027;\nimport { Disability, Equality, Gender } from \u0027./components/sections/Inclusion\u0027;\nimport { Psychologist, Takeaways } from \u0027./components/sections/Role\u0027;\nimport { PROJECT_HREF, ProjectPage } from \u0027./components/sections/About\u0027;\nimport { Quiz } from \u0027./components/sections/Quiz\u0027;\n\nconst Part = ({ n }: { n: number }) =\u003e {\n  const p = PARTS[n - 1];\n  return \u003cPartIntro id={p.id} n={p.n} title={p.title} text={p.text} /\u003e;\n};\n\n/**\n * Two \"pages\" in one file (so the site stays a single index.html):\n *  - the main site, for the reader: content, quiz and summary;\n *  - #/sobre-o-projeto: everything about the academic project itself\n *    (apresentação, objetivos, estratégias, ética, referências).\n */\nfunction useHash() {\n  const [hash, setHash] = useState(() =\u003e window.location.hash);\n  useEffect(() =\u003e {\n    const onChange = () =\u003e setHash(window.location.hash);\n    window.addEventListener(\u0027hashchange\u0027, onChange);\n    return () =\u003e window.removeEventListener(\u0027hashchange\u0027, onChange);\n  }, []);\n  return hash;\n}\n\nexport default function App() {\n  const hash = useHash();\n  const onProjectPage = hash === PROJECT_HREF;\n\n  // After switching page, go to the right place: the top of the project page,\n  // or the section named in the address when coming back to the main site.\n  useEffect(() =\u003e {\n    const go = () =\u003e {\n      if (onProjectPage) {\n        window.scrollTo({ top: 0, behavior: \u0027auto\u0027 });\n        return;\n      }\n      const id = hash.replace(\u0027#\u0027, \u0027\u0027);\n      if (id) document.getElementById(id)?.scrollIntoView({ behavior: \u0027auto\u0027 });\n    };\n    // Twice: once right after rendering, once after the layout settles.\n    requestAnimationFrame(go);\n    const t = setTimeout(go, 120);\n    return () =\u003e clearTimeout(t);\n  }, [hash, onProjectPage]);\n\n  return (\n    \u003cmain className=\"relative min-h-screen bg-black\"\u003e\n      \u003cBackgroundVideo /\u003e\n      \u003cNavbar /\u003e\n\n      {onProjectPage ? (\n        \u003cProjectPage /\u003e\n      ) : (\n        \u003c\u003e\n          \u003cStressMarks /\u003e\n          \u003cHero /\u003e\n          \u003cOverview /\u003e\n\n          \u003cPart n={1} /\u003e\n          \u003cWhatIs /\u003e\n          \u003cHistory /\u003e\n          \u003cPsychologist /\u003e\n\n          \u003cPart n={2} /\u003e\n          \u003cCulture /\u003e\n          \u003cBehavior /\u003e\n          \u003cClimate /\u003e\n\n          \u003cPart n={3} /\u003e\n          \u003cWorkIllness /\u003e\n          \u003cBurnout /\u003e\n\n          \u003cPart n={4} /\u003e\n          \u003cGender /\u003e\n          \u003cDisability /\u003e\n          \u003cEquality /\u003e\n\n          \u003cQuiz /\u003e\n          \u003cTakeaways /\u003e\n        \u003c/\u003e\n      )}\n\n      \u003cFooter /\u003e\n    \u003c/main\u003e\n  );\n}\n","src/components/BackgroundVideo.tsx":"import { useEffect, useRef } from \u0027react\u0027;\n\nconst VIDEO_SRC =\n  \u0027https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_041744_63efcd78-bf7d-4039-99e2-2461e8a61903.mp4\u0027;\nconst SENSITIVITY = 0.8;\n\nexport default function BackgroundVideo() {\n  const videoRef = useRef\u003cHTMLVideoElement\u003e(null);\n  const prevX = useRef\u003cnumber | null\u003e(null);\n  const targetTime = useRef(0);\n  const seeking = useRef(false);\n\n  useEffect(() =\u003e {\n    const video = videoRef.current;\n    if (!video) return;\n\n    const seekTo = (t: number) =\u003e {\n      seeking.current = true;\n      video.currentTime = t;\n    };\n\n    const onMouseMove = (e: MouseEvent) =\u003e {\n      const duration = video.duration;\n      if (!duration || Number.isNaN(duration)) {\n        prevX.current = e.clientX;\n        return;\n      }\n      if (prevX.current === null) {\n        prevX.current = e.clientX;\n        return;\n      }\n      const delta = e.clientX - prevX.current;\n      prevX.current = e.clientX;\n\n      const offset = (delta / window.innerWidth) * SENSITIVITY * duration;\n      targetTime.current = Math.min(Math.max(targetTime.current + offset, 0), duration);\n\n      if (!seeking.current) seekTo(targetTime.current);\n    };\n\n    const onSeeked = () =\u003e {\n      if (Math.abs(video.currentTime - targetTime.current) \u003e 0.01) {\n        seekTo(targetTime.current);\n      } else {\n        seeking.current = false;\n      }\n    };\n\n    window.addEventListener(\u0027mousemove\u0027, onMouseMove);\n    video.addEventListener(\u0027seeked\u0027, onSeeked);\n    return () =\u003e {\n      window.removeEventListener(\u0027mousemove\u0027, onMouseMove);\n      video.removeEventListener(\u0027seeked\u0027, onSeeked);\n    };\n  }, []);\n\n  return (\n    \u003cvideo\n      ref={videoRef}\n      src={VIDEO_SRC}\n      muted\n      playsInline\n      preload=\"auto\"\n      className=\"fixed inset-0 z-0 h-full w-full object-cover\"\n      style={{ objectPosition: \u002770% center\u0027 }}\n    /\u003e\n  );\n}\n","src/components/Footer.tsx":"import { PROJECT_HREF } from \u0027./section nst onScroll = () =\u003e {\n      setScrolled(window.scrollY \u003e window.innerHeight * 0.85);\n      const line = window.innerHeight * 0.35;\n      let current = 0;\n      for (const p of PARTS) {\n        const el = document.getElementById(p.id);\n        if (el \u0026\u0026 el.getBoundingClientRect().top \u003c= line) current = p.n;\n      }\n      setActive(current);\n    };\n    onScroll();\n    window.addEventListener(\u0027scroll\u0027, onScroll, { passive: true });\n    return () =\u003e window.removeEventListener(\u0027scroll\u0027, onScroll);\n  }, []);\n\n  return (\n    \u003c\u003e\n      \u003cnav\n        className={`fixed top-0 left-0 z-10 flex w-full items-center justify-between px-5 py-4 transition-colors duration-300 sm:px-8 sm:py-5 ${\n          scrolled ? \u0027border-b border-white/10 bg-black/60 backdrop-blur-xl\u0027 : \u0027\u0027\n        }`}\n      \u003e\n        {/* Logo */}\n        \u003ca href=\"#inicio\" className=\"flex items-center gap-3 text-white\"\u003e\n          \u003cspan className=\"text-[21px] tracking-tight sm:text-[26px]\" style={{ fontFamily: \u0027var(--font-heading)\u0027 }}\u003e\n            Ponto de Equilíbrio\n          \u003c/span\u003e\n          \u003cspan className=\"select-none text-[25px] sm:text-[30px]\" style={{ letterSpacing: \u0027-0.02em\u0027 }} aria-hidden=\"true\"\u003e\n            ✳︎\n          \u003c/span\u003e\n        \u003c/a\u003e\n\n        {/* Desktop: the 4 parts */}\n        \u003cdiv className=\"hidden items-center gap-1 min-[900px]:flex\" aria-label=\"Partes do site\"\u003e\n          {PARTS.map((p) =\u003e {\n            const isActive = active === p.n;\n            return (\n              \u003ca\n                key={p.id}\n                href={`#${p.id}`}\n                aria-current={isActive ? \u0027true\u0027 : undefined}\n                className={`flex items-center gap-2 rounded-full px-4 py-[0.35em] text-[16px] transition-colors duration-200 ${\n                  isActive ? \u0027bg-white text-black\u0027 : \u0027text-white/80 hover:text-white\u0027\n                }`}\n              \u003e\n                \u003cspan className={`text-[13px] ${isActive ? \u0027text-black/50\u0027 : \u0027text-white/50\u0027}`}\u003e{p.n}\u003c/span\u003e\n                {p.nav}\n              \u003c/a\u003e\n            );\n          })}\n        \u003c/div\u003e\n\n        {/* Desktop: project page + help (shown when there is room) */}\n        \u003cdiv className=\"hidden items-center gap-5 min-[1100px]:flex\"\u003e\n          \u003ca\n            href={PROJECT_HREF}\n            className=\"rounded-full border border-white/60 px-4 py-[0.3em] text-[15px] text-white transition-colors duration-200 hover:bg-white hover:text-black\"\n          \u003e\n            Sobre o projeto\n          \u003c/a\u003e\n          \u003ca\n            href=\"#ajuda\"\n            className=\"hidden text-[16px] text-white underline underline-offset-2 transition-opacity hover:opacity-60 xl:block\"\n          \u003e\n            Precisa de ajuda?\n          \u003c/a\u003e\n        \u003c/div\u003e\n\n        {/* Mobile hamburger */}\n        \u003cbutton\n          type=\"button\"\n          aria-label={open ? \u0027Fechar menu\u0027 : \u0027Abrir menu\u0027}\n          aria-expanded={open}\n          onClick={() =\u003e setOpen((o) =\u003e !o)}\n          className=\"relative z-20 flex flex-col gap-[5px] p-1 min-[900px]:hidden\"\n        \u003e\n          \u003cspan className={`block h-[2px] w-6 bg-white transition-all duration-300 ${open ? \u0027translate-y-[7px] rotate-45\u0027 : \u0027\u0027}`} /\u003e\n          \u003cspan className={`block h-[2px] w-6 bg-white transition-all duration-300 ${open ? \u0027opacity-0\u0027 : \u0027opacity-100\u0027}`} /\u003e\n          \u003cspan className={`block h-[2px] w-6 bg-white transition-all duration-300 ${open ? \u0027-translate-y-[7px] -rotate-45\u0027 : \u0027\u0027}`} /\u003e\n        \u003c/button\u003e\n      \u003c/nav\u003e\n\n      {/* Mobile overlay: parts with their full titles */}\n      \u003cdiv\n        className=\"fixed inset-0 z-[9] flex flex-col items-start justify-center gap-7 bg-black/90 px-8 backdrop-blur-md transition-opacity duration-300 min-[900px]:hidden\"\n        style={{ opacity: open ? 1 : 0, pointerEvents: open ? \u0027auto\u0027 : \u0027none\u0027 }}\n      \u003e\n        {PARTS.map((p) =\u003e (\n          \u003ca\n            key={p.id}\n            href={`#${p.id}`}\n            onClick={() =\u003e setOpen(false)}\n            className={`transition-opacity hover:opacity-60 ${active === p.n ? \u0027text-white\u0027 : \u0027text-white/70\u0027}`}\n          \u003e\n            \u003cspan className=\"block text-[14px] text-white/50\"\u003eParte {p.n}\u003c/span\u003e\n            \u003cspan className=\"block text-[28px] leading-tight\" style={{ fontFamily: \u0027var(--font-heading)\u0027 }}\u003e\n              {p.title}\n            \u003c/span\u003e\n          \u003c/a\u003e\n        ))}\n        \u003ca\n          href={PROJECT_HREF}\n          onClick={() =\u003e setOpen(false)}\n          className=\"mt-2 rounded-full border border-white/60 px-5 py-2 text-[18px] text-white transition-opacity hover:opacity-60\"\n        \u003e\n          Sobre o projeto\n        \u003c/a\u003e\n        \u003ca\n          href=\"#ajuda\"\n          onClick={() =\u003e setOpen(false)}\n          className=\"text-[20px] text-white underline underline-offset-2 transition-opacity hover:opacity-60\"\n        \u003e\n          Precisa de ajuda?\n        \u003c/a\u003e\n      \u003c/div\u003e\n    \u003c/\u003e\n  );\n}\n","src/components/sections/About.tsx":"import { REFERENCES } from \u0027../../references\u0027;\nimport { Card, Num, Reveal, Section, Step, SubTitle, Tag, pill } from \u0027../ui\u0027;\n\n/* ---------------------------------------------------------------------------\n * Sobre o projeto: tema, público, contexto, justificativa, objetivos e\n * estratégias de comunicação (item 1 e 3 da rubrica da atividade).\n * ------------------------------------------------------------------------- */\n\nconst SPECIFIC_GOALS = [\n  \u0027Contextualizar as bases históricas e conceituais da Psicologia Organizacional.\u0027,\n  \u0027Analisar a dinâmica da tríade formada pela cultura, pelo comportamento e pelo clima organizacional.\u0027,\n  \u0027Discutir a saúde mental no trabalho, o adoecimento laboral e o burnout.\u0027,\n  \u0027Destacar a importância da diversidade de gênero, da inclusão de pessoas com deficiência e da igualdade de oportunidades na construção de organizações igualitárias.\u0027,\n  \u0027Identificar a atuação prática do psicólogo organizacional na promoção e preservação do bem-estar dos colaboradores.\u0027,\n];\n\nconst STRATEGIES = [\n  [\u0027Linguagem acessível\u0027, \u0027Frases curtas, sem jargão. Todo termo técnico é explicado com palavras do dia a dia.\u0027],\n  [\u0027Do simples ao complexo\u0027, \u0027O conteúdo está em 4 partes, em ordem: cada uma prepara o terreno para a próxima.\u0027],\n  [\u0027Mesma sequência em todo tema\u0027, \u0027O que é? → Como funciona → Na prática → Em poucas palavras. O leitor sempre sabe onde está.\u0027],\n  [\u0027Exemplos e perguntas\u0027, \u0027Situações do cotidiano, um “teste rápido” sobre a cultura da empresa e perguntas para refletir.\u0027],\n  [\u0027Interação\u0027, \u0027Um quiz no final, com resposta comentada na hora, para o leitor testar o que aprendeu e rever o que faltou.\u0027],\n  [\u0027Dados reais\u0027, \u0027Números oficiais de afastamentos e a legislação atual (NR-1) mostram que o tema é concreto.\u0027],\n  [\u0027Recursos visuais\u0027, \u0027Capa animada com um personagem sob pressão, mapa dos temas e destaques visuais para fixar as ideias.\u0027],\n  [\u0027Resumos\u0027, \u0027Cada tema termina em uma frase de resumo, e o site fecha com um resumo geral.\u0027],\n  [\u0027Acesso fácil\u0027, \u0027Página gratuita na internet, que funciona no celular e no computador e pode ser compartilhada por link.\u0027],\n];\n\nexport function About() {\n  return (\n    \u003cSection\n      id=\"sobre\"\n      number=\"Projeto\"\n      kicker=\"Sobre o projeto\"\n      title=\"Por que este site existe\"\n      intro=\"Este site é uma página informativa de psicoeducação, feita para levar o conhecimento científico da Psicologia Organizacional para fora da sala de aula, em linguagem que qualquer pessoa entende.\"\n    \u003e\n      \u003cStep label=\"Tema e público\" title=\"Para quem é este conteúdo\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-3\"\u003e\n          \u003cReveal\u003e\n            \u003cCard title=\"Tema\"\u003ePsicologia Organizacional e Saúde do Trabalhador.\u003c/Card\u003e\n          \u003c/Reveal\u003e\n          \u003cReveal delay={100}\u003e\n            \u003cCard title=\"Público-alvo\"\u003e\n              Trabalhadores de qualquer área, estudantes que vão entrar no mercado de trabalho, e gestores e profissionais\n              de RH. Não é preciso saber nada de psicologia para entender.\n            \u003c/Card\u003e\n          \u003c/Reveal\u003e\n          \u003cReveal delay={200}\u003e\n            \u003cCard title=\"Contexto de aplicação\"\u003e\n              Página na internet, gratuita e aberta. Pode ser compartilhada em empresas, faculdades, escolas e redes\n              sociais, e usada como apoio em rodas de conversa, palestras e ações de RH.\n            \u003c/Card\u003e\n          \u003c/Reveal\u003e\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cStep label=\"Justificativa\" title=\"Por que esse tema é importante\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-2\"\u003e\n          \u003cReveal\u003e\n            \u003cCard title=\"Relevância psicológica\"\u003e\n              Em 2024, o Brasil teve \u003cstrong className=\"text-white\"\u003e472.328 afastamentos do trabalho por transtornos\n              mentais\u003c/strong\u003e, 68% a mais que em 2023 e o maior número desde 2014 (OLHAR DIGITAL, 2025; PREVIDENCIARISTA,\n              2026). O trabalho, que deveria ser fonte de realização, também pode adoecer. Entender por quê é o primeiro\n              passo para prevenir.\n            \u003c/Card\u003e\n          \u003c/Reveal\u003e\n          \u003cReveal delay={120}\u003e\n            \u003cCard title=\"Relevância social\"\u003e\n              Desde 2026, a NR-1 obriga as empresas a gerenciar os riscos psicossociais (BRASIL, 2024), e o CFP passou a\n              incluir esse cuidado nas funções do psicólogo (CFP, 2024). Ao mesmo tempo, desigualdades de gênero e a\n              exclusão de pessoas com deficiência ainda marcam o mercado de trabalho. Informar as pessoas ajuda a\n              cobrar e construir ambientes mais saudáveis e justos.\n            \u003c/Card\u003e\n          \u003c/Reveal\u003e\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cStep id=\"objetivos\" label=\"Objetivos\" title=\"O que queremos alcançar\"\u003e\n        \u003cReveal\u003e\n          \u003cCard title=\"Objetivo geral\" className=\"border-white\"\u003e\n            Rever o surgimento da Psicologia Organizacional e como ela se desenvolveu ao longo do tempo; entender a\n            tríade cultura, comportamento e clima organizacional, que reúne desafios tradicionais e contemporâneos\n            potencialmente geradores de adoecimento mental do trabalhador; e revelar o papel do psicólogo organizacional,\n            buscando o equilíbrio entre o desempenho da empresa e o bem-estar de quem trabalha.\n          \u003c/Card\u003e\n        \u003c/Reveal\u003e\n        \u003cReveal\u003e\n          \u003cSubTitle\u003eObjetivos específicos\u003c/SubTitle\u003e\n          \u003col className=\"grid gap-x-8 gap-y-6 md:grid-cols-2\"\u003e\n            {SPECIFIC_GOALS.map((g, i) =\u003e (\n              \u003cli key={g} className=\"flex gap-5 border-t border-white/30 pt-5\"\u003e\n                \u003cNum\u003e{String(i + 1).padStart(2, \u00270\u0027)}\u003c/Num\u003e\n                \u003cp className=\"text-[16px] leading-relaxed text-white/80 sm:text-[17px]\"\u003e{g}\u003c/p\u003e\n              \u003c/li\u003e\n            ))}\n          \u003c/ol\u003e\n        \u003c/Reveal\u003e\n      \u003c/Step\u003e\n\n      \u003cStep id=\"estrategias\" label=\"Estratégias\" title=\"Como o conteúdo foi pensado para ensinar\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 sm:grid-cols-2 lg:grid-cols-3\"\u003e\n          {STRATEGIES.map(([t, d], i) =\u003e (\n            \u003cReveal key={t} delay={(i % 3) * 70}\u003e\n              \u003cCard title={t}\u003e{d}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n      \u003c/Step\u003e\n    \u003c/Section\u003e\n  );\n}\n\n/** Address of the separate \"Sobre o projeto\" page (a hash route). */\nexport const PROJECT_HREF = \u0027#/sobre-o-projeto\u0027;\n\n/**\n * Separate page with everything about the project itself (not the topic):\n * presentation, justification, objectives, strategies, ethics and references.\n * It is what the assessment looks at, so it lives apart from the reading flow.\n */\nexport function ProjectPage() {\n  return (\n    \u003cdiv className=\"relative z-[2] min-h-screen bg-black/70 pt-16 backdrop-blur-3xl\"\u003e\n      \u003cdiv className=\"px-5 pt-10 sm:px-8 md:px-10\"\u003e\n        \u003cdiv className=\"mx-auto flex max-w-6xl flex-wrap gap-2\"\u003e\n          {[\n            [\u0027#sobre\u0027, \u0027Apresentação\u0027],\n            [\u0027#objetivos\u0027, \u0027Objetivos\u0027],\n            [\u0027#estrategias\u0027, \u0027Estratégias\u0027],\n            [\u0027#etica\u0027, \u0027Ética\u0027],\n            [\u0027#referencias\u0027, \u0027Referências\u0027],\n          ].map(([href, label]) =\u003e (\n            \u003cbutton\n              key={href}\n              type=\"button\"\n              onClick={() =\u003e document.getElementById(href.slice(1))?.scrollIntoView({ behavior: \u0027smooth\u0027 })}\n              className={`${pill} border-white/60 text-white transition-colors duration-200 hover:bg-white hover:text-black`}\n            \u003e\n              {label}\n            \u003c/button\u003e\n          ))}\n          \u003ca\n            href=\"#inicio\"\n            className={`${pill} ml-auto border-black/10 bg-white text-black transition-colors duration-200 hover:bg-black hover:text-white`}\n          \u003e\n            ← Voltar ao site\n          \u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cAbout /\u003e\n      \u003cEthics /\u003e\n      \u003cReferences /\u003e\n      \u003cdiv className=\"relative z-[2] px-5 pb-20 sm:px-8 md:px-10\"\u003e\n        \u003cdiv className=\"mx-auto max-w-6xl\"\u003e\n          \u003ca\n            href=\"#inicio\"\n            className={`${pill} border-black/10 bg-white text-black transition-colors duration-200 hover:bg-black hover:text-white`}\n          \u003e\n            ← Voltar ao site\n          \u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  );\n}\n\n/* ---------------------------------------------------------------------------\n * Responsabilidade ética na divulgação da Psicologia.\n * ------------------------------------------------------------------------- */\n\nconst ETHICS = [\n  [\u0027Baseado em ciência\u0027, \u0027Todo o conteúdo vem de autores, pesquisas, normas e dados oficiais, listados nas referências.\u0027],\n  [\u0027Sem culpar a pessoa\u0027, \u0027A linguagem evita estigmas: o adoecimento é tratado como resultado também das condições de trabalho, e não como fraqueza individual.\u0027],\n  [\u0027Não é diagnóstico\u0027, \u0027O site informa e orienta, mas não diagnostica nem substitui o atendimento de um psicólogo ou de outro profissional de saúde.\u0027],\n  [\u0027Incentivo ao cuidado\u0027, \u0027Quem se reconhecer nos sinais de sofrimento é orientado a buscar ajuda: CVV (188), unidades de saúde do SUS e CAPS.\u0027],\n  [\u0027Respeito à diversidade\u0027, \u0027Os temas de gênero, deficiência e igualdade são tratados com respeito e linguagem inclusiva.\u0027],\n  [\u0027Sem expor ninguém\u0027, \u0027Os dados usados são públicos e gerais; nenhuma pessoa, empresa ou caso real é identificado.\u0027],\n];\n\nexport function Ethics() {\n  return (\n    \u003cSection\n      id=\"etica\"\n      number=\"Ética\"\n      kicker=\"Responsabilidade ética\"\n      title=\"Nossos compromissos ao divulgar a Psicologia\"\n      intro=\"Divulgar a Psicologia exige cuidado. Este site segue os princípios do Código de Ética Profissional do Psicólogo (Resolução CFP nº 010/2005), que orienta como informar o público com responsabilidade.\"\n    \u003e\n      \u003cdiv className=\"grid gap-x-8 gap-y-10 sm:grid-cols-2 lg:grid-cols-3\"\u003e\n        {ETHICS.map(([t, d], i) =\u003e (\n          \u003cReveal key={t} delay={(i % 3) * 80}\u003e\n            \u003cCard title={t}\u003e{d}\u003c/Card\u003e\n          \u003c/Reveal\u003e\n        ))}\n      \u003c/div\u003e\n    \u003c/Section\u003e\n  );\n}\n\n/* ---------------------------------------------------------------------------\n * Referências (ABNT).\n * ------------------------------------------------------------------------- */\n\n/** Renders **bold** and *italic* markers used in the reference strings. */\nfunction RefText({ text }: { text: string }) {\n  const parts = text.split(/(\\*\\*[^*]+\\*\\*|\\*[^*]+\\*)/g);\n  return (\n    \u003c\u003e\n      {parts.map((p, i) =\u003e\n        p.startsWith(\u0027**\u0027) ? (\n          \u003cstrong key={i} className=\"text-white\"\u003e\n            {p.slice(2, -2)}\n          \u003c/strong\u003e\n        ) : p.startsWith(\u0027*\u0027) \u0026\u0026 p.length \u003e 2 ? (\n          \u003cem key={i}\u003e{p.slice(1, -1)}\u003c/em\u003e\n        ) : (\n          \u003cspan key={i}\u003e{p}\u003c/span\u003e\n        ),\n      )}\n    \u003c/\u003e\n  );\n}\n\nexport function References() {\n  return (\n    \u003cSection id=\"referencias\" number=\"Fontes\" kicker=\"Referências\" title=\"Referências\"\u003e\n      \u003cReveal\u003e\n        \u003cdiv className=\"mb-8\"\u003e\n          \u003cTag\u003eABNT NBR 6023\u003c/Tag\u003e\n        \u003c/div\u003e\n        \u003cul className=\"space-y-4\"\u003e\n          {REFERENCES.map((r) =\u003e (\n            \u003cli\n              key={r}\n              className=\"border-t border-white/15 pt-4 text-[14px] leading-relaxed text-white/70 [overflow-wrap:anywhere] sm:text-[15px]\"\n            \u003e\n              \u003cRefText text={r} /\u003e\n            \u003c/li\u003e\n          ))}\n        \u003c/ul\u003e\n      \u003c/Reveal\u003e\n    \u003c/Section\u003e\n  );\n}\n","src/components/sections/Basics.tsx":"import { Card, Plain, Reveal, Section, Step, SubTitle, Tag } from \u0027../ui\u0027;\n\nexport function WhatIs() {\n  return (\n    \u003cSection\n      id=\"o-que-e\"\n      number=\"01\"\n      kicker=\"Psicologia Organizacional\"\n      title=\"O que é Psicologia Organizacional?\"\n      define\n      intro=\"É a parte da psicologia que estuda as pessoas no trabalho: como elas se sentem, como se relacionam e como agem dentro da empresa. Ela tem dois objetivos que andam juntos: melhorar o desempenho da empresa e cuidar do bem-estar de quem trabalha.\"\n    \u003e\n      \u003cStep label=\"Como funciona\" title=\"Dois objetivos, um equilíbrio\"\u003e\n        \u003cReveal\u003e\n          \u003cdiv className=\"grid items-stretch gap-x-8 gap-y-6 md:grid-cols-[1fr_auto_1fr]\"\u003e\n            \u003cCard title=\"Desempenho da empresa\"\u003e\n              Produtividade, qualidade, metas cumpridas, boas equipes e bons resultados.\n            \u003c/Card\u003e\n            \u003cdiv className=\"heading flex items-center justify-center text-[32px] text-white/60\"\u003e+\u003c/div\u003e\n            \u003cCard title=\"Bem-estar de quem trabalha\"\u003e\n              Saúde física e mental, respeito, segurança, reconhecimento e satisfação.\n            \u003c/Card\u003e\n          \u003c/div\u003e\n          \u003cp className=\"mt-10 max-w-3xl text-[17px] leading-relaxed text-white/75 sm:text-[19px]\"\u003e\n            \u003cstrong className=\"text-white\"\u003eUm depende do outro.\u003c/strong\u003e Pessoas saudáveis e respeitadas rendem mais e\n            ficam mais tempo na empresa. Já quando o resultado é buscado a qualquer custo, vêm o estresse, as faltas, os\n            afastamentos e a rotatividade, e no fim o desempenho também cai.\n          \u003c/p\u003e\n        \u003c/Reveal\u003e\n\n        \u003cSubTitle\u003ePara isso, ela estuda, previne e promove\u003c/SubTitle\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-3\"\u003e\n          {[\n            [\u0027Estuda\u0027, \u0027A cultura, o comportamento e o clima dentro das empresas.\u0027],\n            [\u0027Previne\u0027, \u0027Estresse, adoecimento, burnout, assédio e discriminação.\u0027],\n            [\u0027Promove\u0027, \u0027Saúde mental, inclusão, igualdade e bem-estar de quem trabalha.\u0027],\n          ].map(([t, d], i) =\u003e (\n            \u003cReveal key={t} delay={i * 100}\u003e\n              \u003cCard title={t}\u003e{d}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n\n        \u003cReveal\u003e\n          \u003cSubTitle\u003ePor que ela é necessária? A própria palavra “trabalho” explica\u003c/SubTitle\u003e\n        \u003c/Reveal\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-2\"\u003e\n          \u003cReveal\u003e\n            \u003cCard title={\u003cspan className=\"flex items-center gap-3\"\u003eTripalium \u003cTag\u003eo lado pesado\u003c/Tag\u003e\u003c/span\u003e}\u003e\n              \u003cstrong className=\"text-white\"\u003eTrabalho\u003c/strong\u003e vem do latim \u003cem\u003etripalium\u003c/em\u003e, um instrumento romano de\n              três estacas usado para prender animais e castigar pessoas. “Tripaliare” queria dizer torturar. Com o\n              tempo, virou “se esforçar”.\n            \u003c/Card\u003e\n          \u003c/Reveal\u003e\n          \u003cReveal delay={120}\u003e\n            \u003cCard title={\u003cspan className=\"flex items-center gap-3\"\u003eOpus \u003cTag variant=\"solid\"\u003eo lado do orgulho\u003c/Tag\u003e\u003c/span\u003e}\u003e\n              Já \u003cem\u003eopus\u003c/em\u003e quer dizer \u003cstrong className=\"text-white\"\u003eobra\u003c/strong\u003e, aquilo que a gente cria e que\n              fica, como em “obra-prima”. É o trabalho que dá identidade, propósito e satisfação.\n            \u003c/Card\u003e\n          \u003c/Reveal\u003e\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cStep label=\"Na prática\" title=\"O que isso muda no dia a dia\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 sm:grid-cols-2 lg:grid-cols-4\"\u003e\n          {[\n            [\u0027Pesquisa de clima\u0027, \u0027Perguntar às pessoas como elas se sentem no trabalho.\u0027],\n            [\u0027Mediação de conflitos\u0027, \u0027Ajudar colegas e chefes a se entenderem.\u0027],\n            [\u0027Canais de denúncia\u0027, \u0027Um lugar seguro para relatar assédio e discriminação.\u0027],\n            [\u0027Saúde mental\u0027, \u0027Programas para prevenir o estresse e o adoecimento.\u0027],\n          ].map(([t, d], i) =\u003e (\n            \u003cReveal key={t} delay={i * 80}\u003e\n              \u003cCard title={t}\u003e{d}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cPlain\u003e\n        A Psicologia Organizacional busca uma empresa que funcione bem com pessoas que estejam bem. Desempenho e bem-estar\n        não são opostos: um sustenta o outro.\n      \u003c/Plain\u003e\n    \u003c/Section\u003e\n  );\n}\n\nconst TIMELINE = [\n  {\n    when: \u00271900s\u0027,\n    who: \u0027Frederick Taylor\u0027,\n    text: \u0027Cronometrava cada movimento na linha de produção para achar a “melhor forma” de fazer cada tarefa. O trabalhador era tratado quase como uma peça da máquina.\u0027,\n  },\n  {\n    when: \u00271910s\u0027,\n    who: \u0027Hugo Münsterberg\u0027,\n    text: \u0027Criou testes psicológicos para descobrir as aptidões de cada um. Nasce a ideia de “a pessoa certa no lugar certo”.\u0027,\n  },\n  {\n    when: \u00271917–18\u0027,\n    who: \u0027Robert Yerkes\u0027,\n    text: \u0027Aplicou testes em cerca de 1,7 milhão de recrutas na Primeira Guerra. Foi a primeira vez que a psicologia ajudou a tomar decisões sobre tanta gente ao mesmo tempo.\u0027,\n  },\n  {\n    when: \u00271920–30\u0027,\n    who: \u0027Elton Mayo e os Estudos de Hawthorne\u0027,\n    text: \u0027Mudaram a luz de uma fábrica para ver se as pessoas produziam mais. Produziram, mas não por causa da luz: foi porque se sentiram observadas e valorizadas. Sentimentos importam tanto quanto eficiência.\u0027,\n  },\n  { when: \u00271930\u0027, who: \u0027Chegada ao Brasil\u0027, text: \u0027A área chega ao país junto com a industrialização.\u0027 },\n  {\n    when: \u00272000\u0027,\n    who: \u0027Especialidade reconhecida\u0027,\n    text: \u0027O Conselho Federal de Psicologia reconhece oficialmente a área (Resolução CFP nº 14/2000).\u0027,\n  },\n  {\n    when: \u00272024\u0027,\n    who: \u0027Saúde mental entra de vez\u0027,\n    text: \u0027A Nota Técnica CFP nº 18/2024 inclui identificar e cuidar dos riscos psicossociais (o que adoece a mente no trabalho) como função do psicólogo.\u0027,\n  },\n];\n\nexport function History() {\n  return (\n    \u003cSection\n      id=\"historia\"\n      number=\"02\"\n      kicker=\"História\"\n      title=\"Como tudo começou\"\n      define\n      intro=\"A Psicologia Organizacional nasceu no começo do século 20, dentro das fábricas, com um objetivo: fazer as pessoas produzirem mais. Com o tempo, entendeu que não existe bom desempenho sem cuidar da saúde de quem trabalha.\"\n    \u003e\n      \u003cStep label=\"Como funciona\" title=\"A linha do tempo\"\u003e\n        \u003col\u003e\n          {TIMELINE.map((item, i) =\u003e (\n            \u003cReveal key={item.when} delay={i * 50}\u003e\n              \u003cli className=\"grid gap-2 border-t border-white/30 py-7 md:grid-cols-[180px_1fr] md:gap-10\"\u003e\n                \u003cdiv\u003e\n                  \u003cTag variant={i === 3 ? \u0027solid\u0027 : \u0027outline\u0027}\u003e{item.when}\u003c/Tag\u003e\n                \u003c/div\u003e\n                \u003cdiv\u003e\n                  \u003ch3 className=\"heading text-[22px] text-white sm:text-[26px]\"\u003e{item.who}\u003c/h3\u003e\n                  \u003cp className=\"mt-2 max-w-2xl text-[16px] leading-relaxed text-white/70 sm:text-[18px]\"\u003e{item.text}\u003c/p\u003e\n                \u003c/div\u003e\n              \u003c/li\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/ol\u003e\n      \u003c/Step\u003e\n\n      \u003cStep label=\"Na prática\" title=\"O que mudou para o trabalhador\"\u003e\n        \u003cReveal\u003e\n          \u003cdiv className=\"grid items-stretch gap-x-8 gap-y-6 md:grid-cols-[1fr_auto_1fr]\"\u003e\n            \u003cdiv className=\"border-t border-white/30 pt-6\"\u003e\n              \u003cp className=\"text-[14px] text-white/60\"\u003eAntes\u003c/p\u003e\n              \u003cp className=\"heading mt-2 text-[22px] text-white sm:text-[28px]\"\u003eSó produtividade: encaixar o trabalhador na máquina\u003c/p\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"heading flex items-center justify-center text-[32px] text-white/60\"\u003e→\u003c/div\u003e\n            \u003cdiv className=\"border-t border-white/60 pt-6\"\u003e\n              \u003cp className=\"text-[14px] text-white/60\"\u003eHoje\u003c/p\u003e\n              \u003cp className=\"heading mt-2 text-[22px] text-white sm:text-[28px]\"\u003eDesempenho com bem-estar: produzir bem sem adoecer\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cp className=\"mt-10 max-w-3xl text-[16px] leading-relaxed text-white/70 sm:text-[18px]\"\u003e\n            \u003cstrong className=\"text-white\"\u003ePara pensar:\u003c/strong\u003e em Hawthorne, ser observado fez as pessoas se sentirem\n            importantes. Hoje, muitas empresas monitoram quem trabalha de casa com programas de produtividade. Será que o\n            efeito é o mesmo?\n          \u003c/p\u003e\n        \u003c/Reveal\u003e\n      \u003c/Step\u003e\n\n      \u003cPlain\u003e\n        A área começou pensando só em produção. Hoje, busca o bom desempenho da empresa cuidando do bem-estar de quem\n        trabalha.\n      \u003c/Plain\u003e\n    \u003c/Section\u003e\n  );\n}\n","src/components/sections/Culture.tsx":"import { Card, Num, Plain, Reveal, Section, Step, SubTitle, Tag } from \u0027../ui\u0027;\n\nconst LEVELS = [\n  {\n    name: \u0027Artefatos\u0027,\n    sub: \u0027O que dá para ver\u0027,\n    where: \u0027Acima da água\u0027,\n    items: [\u0027O espaço físico e a decoração\u0027, \u0027O jeito de falar e de se vestir\u0027, \u0027Rituais e comemorações\u0027, \u0027A rotina do dia a dia\u0027],\n  },\n  {\n    name: \u0027Valores declarados\u0027,\n    sub: \u0027O que a empresa diz\u0027,\n    where: \u0027Na superfície\u0027,\n    items: [\u0027“Inovação e respeito”\u0027, \u0027“Trabalho em equipe”\u0027, \u0027“Transparência”\u0027, \u0027“Diversidade”\u0027],\n  },\n  {\n    name: \u0027Pressupostos básicos\u0027,\n    sub: \u0027O que ninguém fala, mas todo mundo segue\u0027,\n    where: \u0027Lá no fundo\u0027,\n    items: [\u0027“Aqui ninguém questiona o chefe”\u0027, \u0027“Tem que responder mensagem a qualquer hora”\u0027, \u0027Crenças automáticas\u0027, \u0027As verdadeiras regras do jogo\u0027],\n  },\n];\n\nconst QUESTIONS = [\n  [\u0027O discurso bate com a realidade?\u0027, \u0027O que a empresa fala na missão e nos cartazes é o que acontece no dia a dia?\u0027],\n  [\u0027Como as pessoas se tratam?\u0027, \u0027Como chefes e equipe se relacionam no cotidiano?\u0027],\n  [\u0027Errar é permitido?\u0027, \u0027Erro vira aprendizado ou punição? Mudanças são bem-vindas?\u0027],\n  [\u0027E os conflitos?\u0027, \u0027São conversados com transparência ou varridos para debaixo do tapete?\u0027],\n];\n\nexport function Culture() {\n  return (\n    \u003cSection\n      id=\"cultura\"\n      number=\"04\"\n      kicker=\"Cultura organizacional\"\n      title=\"“O jeito como as coisas são feitas aqui”\"\n      define\n      intro=\"Cultura é o conjunto de crenças, costumes e regras (escritas ou não) que guiam como as pessoas agem dentro de uma empresa. É como a personalidade da organização.\"\n    \u003e\n      \u003cStep label=\"Como funciona\" title=\"Os 3 níveis da cultura, segundo Edgar Schein\"\u003e\n        \u003cReveal\u003e\n          \u003cp className=\"-mt-2 mb-10 max-w-2xl text-[17px] text-white/70\"\u003e\n            Schein compara a cultura a um iceberg: uma parte aparece, mas a mais importante fica escondida.\n          \u003c/p\u003e\n        \u003c/Reveal\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-3\"\u003e\n          {LEVELS.map((level, i) =\u003e (\n            \u003cReveal key={level.name} delay={i * 120}\u003e\n              \u003cdiv className={`flex h-full flex-col border-t pt-6 text-white ${i === 2 ? \u0027border-white\u0027 : \u0027border-white/30\u0027}`}\u003e\n                \u003cdiv className=\"flex items-center justify-between\"\u003e\n                  \u003cNum\u003e{i + 1}\u003c/Num\u003e\n                  \u003cspan className=\"text-[13px] opacity-60\"\u003e{level.where}\u003c/span\u003e\n                \u003c/div\u003e\n                \u003ch3 className=\"heading mt-5 text-[23px]\"\u003e{level.name}\u003c/h3\u003e\n                \u003cp className=\"mt-1 text-[15px] opacity-70\"\u003e{level.sub}\u003c/p\u003e\n                \u003cul className=\"mt-5 space-y-2 text-[16px] opacity-85\"\u003e\n                  {level.items.map((it) =\u003e (\n                    \u003cli key={it}\u003e— {it}\u003c/li\u003e\n                  ))}\n                \u003c/ul\u003e\n              \u003c/div\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cStep label=\"Na prática\" title=\"Teste rápido: como é a cultura onde você trabalha?\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 sm:grid-cols-2\"\u003e\n          {QUESTIONS.map(([q, a], i) =\u003e (\n            \u003cReveal key={q} delay={i * 80}\u003e\n              \u003cCard title={q}\u003e{a}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cPlain\u003e\n        Cultura é o jeito da empresa. O que conta não é o que está escrito no cartaz, mas o que acontece de verdade no dia a\n        dia.\n      \u003c/Plain\u003e\n    \u003c/Section\u003e\n  );\n}\n\nconst BEHAVIORS: { name: string; text: string; level: \u0027saudável\u0027 | \u0027atenção\u0027 | \u0027alerta\u0027 }[] = [\n  { name: \u0027Ético\u0027, text: \u0027Regras claras, transparência e respeito entre todos.\u0027, level: \u0027saudável\u0027 },\n  { name: \u0027Responsável\u0027, text: \u0027Foco em cumprir metas e prazos sem estragar as relações.\u0027, level: \u0027saudável\u0027 },\n  { name: \u0027Controlador\u0027, text: \u0027Chefia vigiando o tempo todo, pouca autonomia para a equipe.\u0027, level: \u0027atenção\u0027 },\n  { name: \u0027Competitivo\u0027, text: \u0027Disputa por resultados. Na dose errada, o ambiente fica tóxico.\u0027, level: \u0027atenção\u0027 },\n  { name: \u0027Autoritário\u0027, text: \u0027Só os chefes decidem, sem ouvir opiniões ou colaboração.\u0027, level: \u0027alerta\u0027 },\n  { name: \u0027Persecutório\u0027, text: \u0027Comunicação agressiva, constrangimento frequente e assédio.\u0027, level: \u0027alerta\u0027 },\n];\n\nconst levelVariant = { saudável: \u0027solid\u0027, atenção: \u0027outline\u0027, alerta: \u0027outline\u0027 } as const;\n\nexport function Behavior() {\n  return (\n    \u003cSection\n      id=\"comportamento\"\n      number=\"05\"\n      kicker=\"Comportamento organizacional\"\n      title=\"Como as pessoas agem no trabalho\"\n      define\n      intro=\"Comportamento organizacional é o conjunto de atitudes e formas de agir de pessoas e grupos dentro da empresa. Segundo Idalberto Chiavenato, ele afeta diretamente o sucesso e o desempenho da organização.\"\n    \u003e\n      \u003cStep label=\"Como funciona\" title=\"Os 6 tipos de comportamento\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 sm:grid-cols-2 lg:grid-cols-3\"\u003e\n          {BEHAVIORS.map((b, i) =\u003e (\n            \u003cReveal key={b.name} delay={i * 70}\u003e\n              \u003cCard\n                title={\n                  \u003cspan className=\"flex items-center justify-between gap-3\"\u003e\n                    {b.name}\n                    \u003cTag variant={levelVariant[b.level]}\u003e{b.level}\u003c/Tag\u003e\n                  \u003c/span\u003e\n                }\n              \u003e\n                {b.text}\n              \u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cStep label=\"Na prática\" title=\"Como a empresa descobre como as pessoas agem\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-3\"\u003e\n          {[\n            [\u0027Números\u0027, \u0027Faltas, prazos cumpridos, qualidade, produtividade e engajamento.\u0027],\n            [\u0027Conversas\u0027, \u0027Entrevistas com quem fica e com quem sai, e pesquisas de clima.\u0027],\n            [\u0027Comunicação\u0027, \u0027Aplicativos internos que deixam a conversa mais rápida e próxima.\u0027],\n          ].map(([t, d], i) =\u003e (\n            \u003cReveal key={t} delay={i * 80}\u003e\n              \u003cCard title={t}\u003e{d}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cPlain\u003e\n        O comportamento mostra se os valores da empresa são reais. Ética e respeito constroem; controle demais,\n        autoritarismo e perseguição adoecem.\n      \u003c/Plain\u003e\n    \u003c/Section\u003e\n  );\n}\n\nexport function Climate() {\n  return (\n    \u003cSection\n      id=\"clima\"\n      number=\"06\"\n      kicker=\"Clima organizacional\"\n      title=\"Como é, de verdade, estar aí dentro\"\n      define\n      intro=\"Clima é como as pessoas sentem e vivem o ambiente de trabalho. Se a cultura é a personalidade da empresa, o clima é o humor dela no dia a dia.\"\n    \u003e\n      \u003cStep label=\"Como funciona\" title=\"O que forma o clima\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-3\"\u003e\n          {[\n            [\u0027Liderança\u0027, \u0027Como os chefes se comunicam, orientam e dão retorno.\u0027],\n            [\u0027Relações\u0027, \u0027Cooperação, conflitos, respeito e confiança entre colegas.\u0027],\n            [\u0027Condições\u0027, \u0027Carga de trabalho, recursos, reconhecimento e organização.\u0027],\n          ].map(([t, d], i) =\u003e (\n            \u003cReveal key={t} delay={i * 100}\u003e\n              \u003cCard title={t}\u003e{d}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n        \u003cReveal\u003e\n          \u003cSubTitle\u003eClima e cultura não são a mesma coisa\u003c/SubTitle\u003e\n          \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-2\"\u003e\n            \u003cCard title=\"Clima\"\u003eO que as pessoas sentem: a percepção e a experiência no ambiente de trabalho.\u003c/Card\u003e\n            \u003cCard title=\"Cultura\"\u003eAs regras e crenças da empresa: valores, normas e formas de funcionar.\u003c/Card\u003e\n          \u003c/div\u003e\n        \u003c/Reveal\u003e\n      \u003c/Step\u003e\n\n      \u003cStep label=\"Na prática\" title=\"Como perceber e cuidar do clima\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-2\"\u003e\n          \u003cReveal\u003e\n            \u003cCard title=\"Sinais de clima ruim\"\u003e\n              \u003cul className=\"space-y-2\"\u003e\n                \u003cli\u003e— Estresse e sobrecarga\u003c/li\u003e\n                \u003cli\u003e— Conflitos e dificuldade de comunicação\u003c/li\u003e\n                \u003cli\u003e— Sofrimento relacionado ao trabalho\u003c/li\u003e\n              \u003c/ul\u003e\n            \u003c/Card\u003e\n          \u003c/Reveal\u003e\n          \u003cReveal delay={100}\u003e\n            \u003cCard title=\"Como descobrir\"\u003ePesquisa de clima + ouvir as pessoas de verdade.\u003c/Card\u003e\n          \u003c/Reveal\u003e\n        \u003c/div\u003e\n        \u003cReveal\u003e\n          \u003cp className=\"mb-4 mt-12 text-[15px] text-white/70\"\u003eO que o psicólogo faz, passo a passo:\u003c/p\u003e\n          \u003cdiv className=\"flex flex-wrap items-center gap-2\"\u003e\n            {[\u0027Escutar\u0027, \u0027Analisar\u0027, \u0027Prevenir\u0027, \u0027Intervir\u0027, \u0027Promover saúde\u0027].map((s, i, arr) =\u003e (\n              \u003cspan key={s} className=\"flex items-center gap-2\"\u003e\n                \u003cTag variant={i === arr.length - 1 ? \u0027solid\u0027 : \u0027outline\u0027}\u003e{s}\u003c/Tag\u003e\n                {i \u003c arr.length - 1 \u0026\u0026 \u003cspan className=\"text-white/50\"\u003e→\u003c/span\u003e}\n              \u003c/span\u003e\n            ))}\n          \u003c/div\u003e\n        \u003c/Reveal\u003e\n      \u003c/Step\u003e\n\n      \u003cPlain\u003e\n        O ambiente não explica tudo, mas faz parte da história. Entender o clima é entender a ligação entre trabalho,\n        comportamento e saúde.\n      \u003c/Plain\u003e\n    \u003c/Section\u003e\n  );\n}\n","src/components/sections/Health.tsx":"import { Card, Plain, Reveal, Section, Step, SubTitle, Tag } from \u0027../ui\u0027;\n\nexport function WorkIllness() {\n  return (\n    \u003cSection\n      id=\"adoecimento\"\n      number=\"07\"\n      kicker=\"Adoecimento laboral\"\n      title=\"O desgaste que vai se acumulando\"\n      define\n      intro=\"Adoecimento laboral é quando o trabalho, aos poucos, desgasta o corpo e a mente da pessoa até ela ficar doente. Não acontece de um dia para o outro: é um desgaste que vai se acumulando por causa de condições de trabalho inadequadas.\"\n    \u003e\n      \u003cStep label=\"Como funciona\" title=\"As causas mais comuns\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 sm:grid-cols-2 lg:grid-cols-4\"\u003e\n          {[\n            [\u0027Metas abusivas\u0027, \u0027Cobranças impossíveis de cumprir geram pressão o tempo todo.\u0027],\n            [\u0027Falta de apoio\u0027, \u0027Sem ajuda de chefes e colegas, a pessoa se sente sozinha.\u0027],\n            [\u0027Jornadas longas\u0027, \u0027Horas extras demais roubam o tempo de descanso.\u0027],\n            [\u0027Ambiente tóxico\u0027, \u0027Assédio moral e conflitos constantes afetam a saúde mental.\u0027],\n          ].map(([t, d], i) =\u003e (\n            \u003cReveal key={t} delay={i * 80}\u003e\n              \u003cCard title={t}\u003e{d}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n\n        \u003cReveal\u003e\n          \u003cSubTitle\u003eNão é só o indivíduo: as condições de trabalho também pesam\u003c/SubTitle\u003e\n          \u003cp className=\"-mt-2 max-w-3xl text-[17px] leading-relaxed text-white/75 sm:text-[19px]\"\u003e\n            Durante muito tempo, o adoecimento foi visto como um problema só da pessoa, ligado ao jeito ou à “resistência”\n            de cada um. Pesquisadores da Psicologia Social do Trabalho, na América Latina, mostram que não é bem assim: a\n            saúde mental também é produzida pelas condições concretas de vida e de trabalho. Ou seja, prevenir o\n            adoecimento é também responsabilidade da forma como o trabalho é organizado.\n          \u003c/p\u003e\n        \u003c/Reveal\u003e\n        \u003cdiv className=\"mt-10 grid gap-x-8 gap-y-10 md:grid-cols-3\"\u003e\n          {[\n            [\u0027Laurell \u0026 Noriega (México, 1989)\u0027, \u0027Falam em “carga de trabalho”: física, química, mecânica e psíquica. O desgaste da saúde é um processo contínuo, produzido pela organização do trabalho, e não um risco isolado.\u0027],\n            [\u0027Edith Seligmann-Silva (Brasil)\u0027, \u0027Explica o “desgaste mental do trabalhador” em camadas: da economia do país às condições de vida, passando pela empresa até chegar à pessoa.\u0027],\n            [\u0027José Newton de Araújo (PUC Minas)\u0027, \u0027Questiona quando a empresa diz “valorizar o lado emocional” do trabalhador: isso traz liberdade real ou só uma forma mais sofisticada de exigir mais dele?\u0027],\n          ].map(([who, text], i) =\u003e (\n            \u003cReveal key={who} delay={i * 100}\u003e\n              \u003cCard title={who}\u003e{text}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cStep label=\"Na prática\" title=\"Um problema real, em números\"\u003e\n        \u003cReveal\u003e\n          \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-2\"\u003e\n            \u003cdiv className=\"border-t border-white/60 pt-6\"\u003e\n              \u003cp className=\"heading leading-none\" style={{ fontSize: \u0027clamp(48px, 7vw, 80px)\u0027 }}\u003e\n                472.328\n              \u003c/p\u003e\n              \u003cp className=\"mt-4 text-[17px] leading-relaxed text-white/75\"\u003e\n                afastamentos do trabalho por transtornos mentais no Brasil em 2024. Isso é{\u0027 \u0027}\n                \u003cstrong className=\"text-white\"\u003e68% a mais\u003c/strong\u003e que em 2023 e o maior número desde 2014.{\u0027 \u0027}\n                \u003cstrong className=\"text-white\"\u003e64% eram mulheres\u003c/strong\u003e, com idade média de 41 anos.\n              \u003c/p\u003e\n            \u003c/div\u003e\n            \u003cdiv className=\"border-t border-white/60 pt-6\"\u003e\n              \u003cp className=\"heading leading-none\" style={{ fontSize: \u0027clamp(48px, 7vw, 80px)\u0027 }}\u003e\n                500 mil+\n              \u003c/p\u003e\n              \u003cp className=\"mt-4 text-[17px] leading-relaxed text-white/75\"\u003e\n                afastamentos estimados em 2025 (dado preliminar). Seria um novo recorde.\n              \u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv className=\"mt-12 grid gap-x-8 gap-y-10 md:grid-cols-2\"\u003e\n            \u003cCard title=\"Para quem trabalha\"\u003e\n              Sofrimento, perda de saúde, afastamento do trabalho e impacto na vida pessoal e familiar.\n            \u003c/Card\u003e\n            \u003cCard title=\"Para a empresa\"\u003e\n              Mais faltas, afastamentos e trocas de funcionários, e queda na produtividade. Cuidar da saúde também é cuidar\n              do desempenho.\n            \u003c/Card\u003e\n          \u003c/div\u003e\n          \u003cdiv className=\"mt-12 border-t border-white/30 pt-6\"\u003e\n            \u003cTag\u003eO que diz a lei\u003c/Tag\u003e\n            \u003cp className=\"mt-4 max-w-3xl text-[17px] leading-relaxed text-white/75 sm:text-[19px]\"\u003e\n              Desde \u003cstrong className=\"text-white\"\u003e26/05/2026\u003c/strong\u003e, a norma \u003cstrong className=\"text-white\"\u003eNR-1\u003c/strong\u003e{\u0027 \u0027}\n              passou a ser fiscalizada: as empresas são obrigadas a identificar e cuidar dos{\u0027 \u0027}\n              \u003cstrong className=\"text-white\"\u003eriscos psicossociais\u003c/strong\u003e, ou seja, tudo aquilo no trabalho que pode\n              adoecer a mente. A norma internacional ISO 45003:2021 é a referência usada para isso. O objetivo é ter\n              ambientes psicologicamente seguros, com autonomia, respeito e apoio.\n            \u003c/p\u003e\n          \u003c/div\u003e\n        \u003c/Reveal\u003e\n      \u003c/Step\u003e\n\n      \u003cPlain\u003e\n        Adoecimento laboral é um desgaste que se acumula com o tempo. Ele depende muito das condições de trabalho, e por\n        isso a lei agora obriga as empresas a prevenir.\n      \u003c/Plain\u003e\n    \u003c/Section\u003e\n  );\n}\n\nexport function Burnout() {\n  return (\n    \u003cSection\n      id=\"burnout\"\n      number=\"08\"\n      kicker=\"Síndrome de burnout\"\n      title=\"Burnout: quando a energia acaba\"\n      define\n      intro=\"Burnout é um esgotamento causado pelo trabalho. A Organização Mundial da Saúde (CID-11) o reconhece como um fenômeno ocupacional: tensão emocional e estresse provocados por condições de trabalho desgastantes. É a forma mais conhecida de adoecimento laboral.\"\n    \u003e\n      \u003cStep label=\"Como funciona\" title=\"Os 3 sinais do burnout\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-3\"\u003e\n          {[\n            [\u0027Exaustão\u0027, \u0027Cansaço extremo, físico e mental. A sensação de que a energia acabou de vez e não dá para fazer as tarefas.\u0027],\n            [\u0027Distanciamento\u0027, \u0027Frieza, cinismo ou irritação com colegas, clientes e com a própria rotina.\u0027],\n            [\u0027Sensação de incapacidade\u0027, \u0027Achar o tempo todo que não é capaz, que nada dá certo ou que o trabalho perdeu o sentido.\u0027],\n          ].map(([t, d], i) =\u003e (\n            \u003cReveal key={t} delay={i * 100}\u003e\n              \u003cCard title={\u003cspan className=\"flex items-center gap-3\"\u003e\u003cTag\u003eSinal {i + 1}\u003c/Tag\u003e{t}\u003c/span\u003e}\u003e{d}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n        \u003cReveal\u003e\n          \u003cp className=\"mt-10 max-w-3xl border-t border-white/30 pt-5 text-[16px] leading-relaxed text-white/75 sm:text-[17px]\"\u003e\n            \u003cstrong className=\"text-white\"\u003eImportante:\u003c/strong\u003e estes sinais servem para informar, e não para fazer\n            autodiagnóstico. Ter um ou outro sinal não quer dizer que a pessoa tem burnout. Só um profissional de saúde,\n            como um psicólogo ou um médico, pode avaliar cada caso.\n          \u003c/p\u003e\n        \u003c/Reveal\u003e\n      \u003c/Step\u003e\n\n      \u003cStep label=\"Na prática\" title=\"Como reconhecer e o que fazer\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-2\"\u003e\n          \u003cReveal\u003e\n            \u003cCard title=\"Não é frescura\"\u003e\n              Não é preguiça nem falta de força de vontade. É uma condição reconhecida pela OMS, e o cuidado envolve a\n              pessoa \u003cem\u003ee\u003c/em\u003e as condições de trabalho que levaram a ela.\n            \u003c/Card\u003e\n          \u003c/Reveal\u003e\n          \u003cReveal delay={100}\u003e\n            \u003cCard title=\"Não é só um dia ruim\"\u003e\n              Todo mundo tem dias cansativos. No burnout, o esgotamento não passa com um fim de semana de descanso: ele vira\n              o estado normal.\n            \u003c/Card\u003e\n          \u003c/Reveal\u003e\n        \u003c/div\u003e\n        \u003cReveal\u003e\n          \u003cdiv id=\"ajuda\" className=\"mt-14 scroll-mt-24 border-t border-white/60 pt-8\"\u003e\n            \u003ch3 className=\"heading\" style={{ fontSize: \u0027clamp(26px, 3.5vw, 36px)\u0027 }}\u003e\n              Se reconheceu em algo aqui?\n            \u003c/h3\u003e\n            \u003cp className=\"mt-3 max-w-3xl text-[17px] leading-relaxed text-white/85 sm:text-[19px]\"\u003e\n              Você não está sozinho e não é fraqueza. Converse com alguém de confiança e procure um profissional de saúde:\n              uma unidade de saúde do SUS ou um CAPS podem te orientar. Se precisar conversar agora, o{\u0027 \u0027}\n              \u003cstrong className=\"text-white\"\u003eCVV atende pelo 188\u003c/strong\u003e, 24 horas, de graça, ou pelo site cvv.org.br.\n            \u003c/p\u003e\n          \u003c/div\u003e\n        \u003c/Reveal\u003e\n      \u003c/Step\u003e\n\n      \u003cPlain\u003e\n        Burnout é esgotamento causado pelo trabalho, reconhecido pela OMS. Não é fraqueza e precisa de cuidado: da pessoa\n        e das condições de trabalho.\n      \u003c/Plain\u003e\n    \u003c/Section\u003e\n  );\n}\n","src/components/sections/Inclusion.tsx":"import { Card, Num, Plain, Reveal, Section, Step, SubTitle, Tag } from \u0027../ui\u0027;\n\nexport function Gender() {\n  return (\n    \u003cSection\n      id=\"genero\"\n      number=\"09\"\n      kicker=\"Diversidade de gênero\"\n      title=\"Oportunidades iguais, de verdade\"\n      define\n      intro=\"Diversidade de gênero é garantir que todas as pessoas, de qualquer gênero, tenham as mesmas chances no trabalho, combatendo preconceitos e barreiras que existem há muito tempo.\"\n    \u003e\n      \u003cStep label=\"Como funciona\" title=\"Os principais obstáculos\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 lg:grid-cols-2\"\u003e\n          \u003cReveal\u003e\n            \u003cCard title=\"O que ainda acontece\"\u003e\n              \u003cul className=\"mt-1\"\u003e\n                {[\n                  \u0027Estereótipos e preconceitos, abertos ou disfarçados\u0027,\n                  \u0027Discriminação e assédio no trabalho\u0027,\n                  \u0027Tarefas “de homem” e “de mulher” e chances desiguais\u0027,\n                  \u0027Poucas mulheres em cargos de chefia\u0027,\n                ].map((t) =\u003e (\n                  \u003cli key={t} className=\"border-t border-white/15 py-3 first:border-0 first:pt-0\"\u003e\n                    {t}\n                  \u003c/li\u003e\n                ))}\n              \u003c/ul\u003e\n            \u003c/Card\u003e\n          \u003c/Reveal\u003e\n          \u003cReveal delay={120}\u003e\n            \u003cCard title=\"O fenômeno do “teto de vidro”\"\u003e\n              São barreiras que ninguém escreve, mas que impedem mulheres de chegar aos cargos mais altos. Não dá para ver,\n              mas está lá.\n              \u003cbr /\u003e\n              \u003cbr /\u003e\n              \u003cstrong className=\"text-white\"\u003eO resultado:\u003c/strong\u003e carreiras que andam mais devagar, menos mulheres na\n              diretoria e salários diferentes para o mesmo trabalho.\n            \u003c/Card\u003e\n          \u003c/Reveal\u003e\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cStep label=\"Na prática\" title=\"Como a Psicologia Organizacional ajuda\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-3\"\u003e\n          {[\n            [\u0027Combater vieses\u0027, \u0027Programas para desmontar preconceitos que a gente nem percebe, nas contratações e nas avaliações.\u0027],\n            [\u0027Prevenir e proteger\u0027, \u0027Canais de denúncia seguros e tolerância zero com discriminação e assédio.\u0027],\n            [\u0027Liderança feminina\u0027, \u0027Mentoria, crescimento na carreira e mulheres nos lugares onde as decisões são tomadas.\u0027],\n          ].map(([t, d], i) =\u003e (\n            \u003cReveal key={t} delay={i * 100}\u003e\n              \u003cCard title={t}\u003e{d}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cPlain\u003e\n        Diversidade de gênero é dar as mesmas chances para todos. Para isso, é preciso derrubar barreiras visíveis e\n        invisíveis, como o teto de vidro.\n      \u003c/Plain\u003e\n    \u003c/Section\u003e\n  );\n}\n\nconst QUOTAS = [\n  [\u0027100 a 200\u0027, \u00272%\u0027],\n  [\u0027201 a 500\u0027, \u00273%\u0027],\n  [\u0027501 a 1.000\u0027, \u00274%\u0027],\n  [\u0027Mais de 1.000\u0027, \u00275%\u0027],\n];\n\nexport function Disability() {\n  return (\n    \u003cSection\n      id=\"inclusao\"\n      number=\"10\"\n      kicker=\"Pessoas com deficiência\"\n      title=\"Incluir é mais do que contratar\"\n      define\n      intro=\"Inclusão de pessoas com deficiência (PcD) é adaptar a empresa para acolher, respeitar e desenvolver cada pessoa, e não esperar que ela se vire sozinha.\"\n    \u003e\n      \u003cStep label=\"Como funciona\" title=\"Integrar não é o mesmo que incluir\"\u003e\n        \u003cReveal\u003e\n          \u003cdiv className=\"grid items-stretch gap-x-8 gap-y-6 md:grid-cols-[1fr_auto_1fr]\"\u003e\n            \u003cCard title=\"Integração\"\u003e\n              Colocar a pessoa na empresa e esperar que \u003cstrong className=\"text-white\"\u003eela\u003c/strong\u003e se adapte ao ambiente.\n            \u003c/Card\u003e\n            \u003cdiv className=\"heading flex items-center justify-center text-[20px] text-white/60\"\u003evs.\u003c/div\u003e\n            \u003cCard title=\"Inclusão\" className=\"border-white\"\u003e\n              Adaptar \u003cstrong className=\"text-white\"\u003ea empresa\u003c/strong\u003e para acolher e valorizar o jeito único de cada um.\n            \u003c/Card\u003e\n          \u003c/div\u003e\n        \u003c/Reveal\u003e\n\n        \u003cdiv className=\"mt-14 grid gap-x-12 gap-y-14 lg:grid-cols-2\"\u003e\n          \u003cReveal\u003e\n            \u003cSubTitle\u003eA Lei de Cotas\u003c/SubTitle\u003e\n            \u003cp className=\"-mt-2 text-[17px] leading-relaxed text-white/75\"\u003e\n              A \u003cstrong className=\"text-white\"\u003eLei nº 8.213/1991\u003c/strong\u003e obriga empresas com 100 ou mais funcionários a\n              reservar parte das vagas para pessoas com deficiência ou reabilitadas.\n            \u003c/p\u003e\n            \u003cdiv className=\"mt-6 border-t border-white/30\"\u003e\n              \u003cdiv className=\"grid grid-cols-2 py-3 text-[14px] text-white/60\"\u003e\n                \u003cspan\u003eFuncionários\u003c/span\u003e\n                \u003cspan className=\"text-right\"\u003eVagas reservadas\u003c/span\u003e\n              \u003c/div\u003e\n              {QUOTAS.map(([size, pct]) =\u003e (\n                \u003cdiv key={size} className=\"grid grid-cols-2 items-center border-t border-white/15 py-4 text-[17px] text-white\"\u003e\n                  \u003cspan\u003e{size}\u003c/span\u003e\n                  \u003cspan className=\"text-right\"\u003e\n                    \u003cTag variant=\"solid\"\u003e{pct}\u003c/Tag\u003e\n                  \u003c/span\u003e\n                \u003c/div\u003e\n              ))}\n            \u003c/div\u003e\n            \u003cp className=\"mt-4 text-[15px] text-white/60\"\u003eMais do que cumprir a lei, ela ajuda a mudar a cultura da empresa.\u003c/p\u003e\n          \u003c/Reveal\u003e\n\n          \u003cReveal delay={120}\u003e\n            \u003cSubTitle\u003eOs 4 pilares da acessibilidade\u003c/SubTitle\u003e\n            \u003cdiv className=\"grid gap-6\"\u003e\n              {[\n                [\u0027Arquitetônica\u0027, \u0027Rampas, elevadores, banheiros adaptados, piso tátil e caminhos livres.\u0027],\n                [\u0027Atitudinal\u0027, \u0027Combater o preconceito e o capacitismo, começando pelas lideranças.\u0027],\n                [\u0027Tecnológica e comunicacional\u0027, \u0027Leitores de tela, programas adaptados, intérprete de Libras.\u0027],\n                [\u0027Procedimental\u0027, \u0027Seleção, avaliações e treinamentos ajustados para cada necessidade.\u0027],\n              ].map(([t, d], i) =\u003e (\n                \u003cdiv key={t} className=\"flex gap-5 border-t border-white/30 pt-5\"\u003e\n                  \u003cNum\u003e{i + 1}\u003c/Num\u003e\n                  \u003cdiv\u003e\n                    \u003cp className=\"heading text-[19px] text-white\"\u003e{t}\u003c/p\u003e\n                    \u003cp className=\"mt-1 text-[16px] text-white/70\"\u003e{d}\u003c/p\u003e\n                  \u003c/div\u003e\n                \u003c/div\u003e\n              ))}\n            \u003c/div\u003e\n          \u003c/Reveal\u003e\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cStep label=\"Na prática\" title=\"O que atrapalha e como fazer certo\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 sm:grid-cols-2 lg:grid-cols-4\"\u003e\n          {[\n            [\u0027Capacitismo\u0027, \u0027A ideia errada de que pessoas com deficiência produzem menos.\u0027],\n            [\u0027Vagas que excluem\u0027, \u0027Exigências desnecessárias para a função que barram candidatos.\u0027],\n            [\u0027Acessibilidade de fachada\u0027, \u0027Ter rampa, mas ignorar o clima e as ferramentas do dia a dia.\u0027],\n            [\u0027Carreira travada\u0027, \u0027Manter a pessoa sempre no mesmo cargo, sem chance de crescer.\u0027],\n          ].map(([t, d], i) =\u003e (\n            \u003cReveal key={t} delay={i * 80}\u003e\n              \u003cCard title={t}\u003e{d}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n        \u003cReveal\u003e\n          \u003cSubTitle\u003eInclusão em 5 passos\u003c/SubTitle\u003e\n          \u003col className=\"grid gap-x-8 gap-y-10 md:grid-cols-5\"\u003e\n            {[\n              [\u0027Diagnóstico\u0027, \u0027Ver como está a acessibilidade e a cultura hoje.\u0027],\n              [\u0027Treinamento\u0027, \u0027Preparar chefes e equipes contra o capacitismo.\u0027],\n              [\u0027Seleção inclusiva\u0027, \u0027Vagas pensadas nas habilidades reais.\u0027],\n              [\u0027Acolhimento\u0027, \u0027Acompanhar de perto a chegada da pessoa.\u0027],\n              [\u0027Comitê\u0027, \u0027Um grupo para medir e melhorar sempre.\u0027],\n            ].map(([t, d], i) =\u003e (\n              \u003cli key={t} className=\"border-t border-white/30 pt-5\"\u003e\n                \u003cNum\u003e{i + 1}\u003c/Num\u003e\n                \u003cp className=\"heading mt-3 text-[19px] text-white\"\u003e{t}\u003c/p\u003e\n                \u003cp className=\"mt-1 text-[15px] leading-relaxed text-white/70\"\u003e{d}\u003c/p\u003e\n              \u003c/li\u003e\n            ))}\n          \u003c/ol\u003e\n        \u003c/Reveal\u003e\n      \u003c/Step\u003e\n\n      \u003cPlain\u003e\n        Incluir não é só cumprir a cota: é adaptar o ambiente, as atitudes e os processos para que cada pessoa possa\n        trabalhar e crescer.\n      \u003c/Plain\u003e\n    \u003c/Section\u003e\n  );\n}\n\nexport function Equality() {\n  return (\n    \u003cSection\n      id=\"igualdade\"\n      number=\"11\"\n      kicker=\"Igualdade de oportunidades\"\n      title=\"A mesma chance para todo mundo\"\n      define\n      intro=\"Igualdade de oportunidades é garantir que todas as pessoas tenham a mesma chance de entrar na empresa, crescer e chegar à liderança, seja qual for o gênero, a cor, a origem ou a deficiência.\"\n    \u003e\n      \u003cStep label=\"Como funciona\" title=\"Os 3 pilares\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 md:grid-cols-3\"\u003e\n          {[\n            [\u0027Acesso justo\u0027, \u0027Processos seletivos transparentes e organizados, com critérios iguais para todos.\u0027],\n            [\u0027Desenvolvimento\u0027, \u0027Oportunidades iguais de crescer, aprender e ter mentoria.\u0027],\n            [\u0027Cultura inclusiva\u0027, \u0027Liderança comprometida de verdade com a igualdade, no dia a dia.\u0027],\n          ].map(([t, d], i) =\u003e (\n            \u003cReveal key={t} delay={i * 100}\u003e\n              \u003cCard title={t}\u003e{d}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cStep label=\"Na prática\" title=\"O que a empresa ganha com isso\"\u003e\n        \u003cdiv className=\"grid gap-x-8 gap-y-10 sm:grid-cols-2 lg:grid-cols-4\"\u003e\n          {[\n            [\u0027Ambiente melhor\u0027, \u0027Mais engajamento, empatia e sensação de pertencer à equipe.\u0027],\n            [\u0027Mais criatividade\u0027, \u0027Pessoas diferentes trazem ideias e soluções diferentes.\u0027],\n            [\u0027Boa reputação\u0027, \u0027A empresa vira referência e atrai os melhores talentos.\u0027],\n            [\u0027Compromisso social\u0027, \u0027Cumpre seu papel social e as metas de ESG (ambiental, social e governança).\u0027],\n          ].map(([t, d], i) =\u003e (\n            \u003cReveal key={t} delay={i * 80}\u003e\n              \u003cCard title={t}\u003e{d}\u003c/Card\u003e\n            \u003c/Reveal\u003e\n          ))}\n        \u003c/div\u003e\n      \u003c/Step\u003e\n\n      \u003cPlain\u003e\n        “Diversidade é convidar para a festa; inclusão é chamar para dançar.” Igualdade não é favor: é justiça, e também\n        deixa a empresa mais forte.\n      \u003c/Plain\u003e\n    \u003c/Section\u003e\n  );\n}\n","src/components/sections/Overview.tsx":"import { PARTS, TOPICS } from \u0027../../topics\u0027;\nimport { Reveal, Section, Tag } from \u0027../ui\u0027;\n\nconst STEPS = [\u0027O que é?\u0027, \u0027Como funciona\u0027, \u0027Na prática\u0027, \u0027Em poucas palavras\u0027];\n\n/** The map of the site: the 5 parts, their topics, and the reading order. */\nexport function Overview() {\n  return (\n    \u003cSection\n      id=\"temas\"\n      number=\"Mapa\"\n      kicker=\"Como o site está organizado\"\n      title={`${TOPICS.length} temas, em ${PARTS.length} partes`}\n      intro=\"Os temas estão em ordem: cada parte prepara o terreno para a próxima. Clique em qualquer tema para ir direto até ele. No final, um quiz rápido ajuda você a testar o que aprendeu.\"\n    \u003e\n      \u003cReveal\u003e\n        \u003cp className=\"mb-4 text-[15px] text-white/70\"\u003eTodo tema é explicado sempre na mesma ordem:\u003c/p\u003e\n        \u003cdiv className=\"flex flex-wrap items-center gap-2\"\u003e\n          {STEPS.map((s, i) =\u003e (\n            \u003cspan key={s} className=\"flex items-center gap-2\"\u003e\n              \u003cTag variant=\"solid\"\u003e{s}\u003c/Tag\u003e\n              {i \u003c STEPS.length - 1 \u0026\u0026 \u003cspan className=\"text-white/50\"\u003e→\u003c/span\u003e}\n            \u003c/span\u003e\n          ))}\n        \u003c/div\u003e\n      \u003c/Reveal\u003e\n\n      \u003cdiv className=\"mt-16 space-y-14\"\u003e\n        {PARTS.map((part) =\u003e (\n          \u003cReveal key={part.id}\u003e\n            \u003cdiv className=\"grid gap-6 border-t border-white/30 pt-6 md:grid-cols-[260px_1fr] md:gap-10\"\u003e\n              \u003ca href={`#${part.id}`} className=\"transition-opacity hover:opacity-60\"\u003e\n                \u003cp className=\"text-[14px] text-white/60\"\u003eParte {part.n}\u003c/p\u003e\n                \u003cp className=\"heading mt-1 text-[24px] leading-tight sm:text-[28px]\"\u003e{part.title}\u003c/p\u003e\n              \u003c/a\u003e\n              \u003cdiv className=\"grid gap-x-8 gap-y-6 sm:grid-cols-2\"\u003e\n                {TOPICS.filter((t) =\u003e t.part === part.n).map((t) =\u003e (\n                  \u003ca key={t.id} href={`#${t.id}`} className=\"block transition-opacity duration-200 hover:opacity-60\"\u003e\n                    \u003cspan className=\"text-[14px] text-white/50\"\u003e{t.n}\u003c/span\u003e\n                    \u003cspan className=\"heading mt-1 block text-[20px] leading-tight\"\u003e{t.title}\u003c/span\u003e\n                    \u003cspan className=\"mt-1 block text-[16px] leading-relaxed text-white/70\"\u003e{t.short}\u003c/span\u003e\n                  \u003c/a\u003e\n                ))}\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/Reveal\u003e\n        ))}\n      \u003c/div\u003e\n    \u003c/Section\u003e\n  );\n}\n","src/components/sections/Quiz.tsx":"import { useState } from \u0027react\u0027;\nimport { Reveal, Section, Tag, pill } from \u0027../ui\u0027;\n\n/*\n * Interactive knowledge check (rubric item 4: \"interação com o público\").\n * It tests what the reader learned about the topics. It is NOT a diagnostic\n * test, so it never asks about the reader\u0027s own health (rubric item 5).\n */\n\ntype Question = { q: string; options: string[]; answer: number; why: string; topic: string; topicId: string };\n\nconst QUESTIONS: Question[] = [\n  {\n    q: \u0027Qual é o objetivo da Psicologia Organizacional?\u0027,\n    options: [\u0027Só aumentar a produtividade\u0027, \u0027Unir o bom desempenho da empresa ao bem-estar de quem trabalha\u0027, \u0027Só fazer entrevistas de emprego\u0027],\n    answer: 1,\n    why: \u0027Ela busca os dois ao mesmo tempo: pessoas saudáveis rendem mais, e resultado a qualquer custo adoece e derruba o desempenho.\u0027,\n    topic: \u0027Psicologia Organizacional\u0027,\n    topicId: \u0027o-que-e\u0027,\n  },\n  {\n    q: \u0027O que os Estudos de Hawthorne descobriram?\u0027,\n    options: [\u0027Que mais luz aumenta a produção\u0027, \u0027Que se sentir observado e valorizado aumenta a produção\u0027, \u0027Que só o salário motiva as pessoas\u0027],\n    answer: 1,\n    why: \u0027A produção subiu não por causa da luz, mas porque os trabalhadores se sentiram importantes. Sentimentos importam.\u0027,\n    topic: \u0027História\u0027,\n    topicId: \u0027historia\u0027,\n  },\n  {\n    q: \u0027“Aqui ninguém questiona o chefe” é um exemplo de qual nível da cultura, segundo Schein?\u0027,\n    options: [\u0027Artefatos (o que dá para ver)\u0027, \u0027Valores declarados (o que a empresa diz)\u0027, \u0027Pressupostos básicos (o que ninguém fala, mas todos seguem)\u0027],\n    answer: 2,\n    why: \u0027É uma regra que não está escrita em lugar nenhum, mas todo mundo segue: o nível mais profundo da cultura.\u0027,\n    topic: \u0027Cultura organizacional\u0027,\n    topicId: \u0027cultura\u0027,\n  },\n  {\n    q: \u0027Qual é a diferença entre clima e cultura?\u0027,\n    options: [\u0027São a mesma coisa\u0027, \u0027Clima é o que as pessoas sentem; cultura são as regras e crenças da empresa\u0027, \u0027Cultura muda todos os dias; clima nunca muda\u0027],\n    answer: 1,\n    why: \u0027Se a cultura é a personalidade da empresa, o clima é o humor dela no dia a dia.\u0027,\n    topic: \u0027Clima organizacional\u0027,\n    topicId: \u0027clima\u0027,\n  },\n  {\n    q: \u0027Do que depende o adoecimento laboral?\u0027,\n    options: [\u0027Só de a pessoa ser “fraca”\u0027, \u0027Também das condições de trabalho, como metas abusivas e jornadas longas\u0027, \u0027Só do salário\u0027],\n    answer: 1,\n    why: \u0027Pesquisadores mostram que as condições concretas de trabalho têm grande peso. Por isso, prevenir também é papel da empresa.\u0027,\n    topic: \u0027Adoecimento laboral\u0027,\n    topicId: \u0027adoecimento\u0027,\n  },\n  {\n    q: \u0027Qual destes NÃO é um dos 3 sinais do burnout?\u0027,\n    options: [\u0027Exaustão\u0027, \u0027Distanciamento e cinismo\u0027, \u0027Sentir-se motivado e cheio de energia\u0027],\n    answer: 2,\n    why: \u0027Os 3 sinais são exaustão, distanciamento e sensação de incapacidade. Só um profissional pode avaliar se é burnout.\u0027,\n    topic: \u0027Burnout\u0027,\n    topicId: \u0027burnout\u0027,\n  },\n  {\n    q: \u0027O que significa incluir pessoas com deficiência?\u0027,\n    options: [\u0027Só cumprir a cota da lei\u0027, \u0027Adaptar a empresa para acolher e desenvolver cada pessoa\u0027, \u0027Contratar e esperar que a pessoa se adapte sozinha\u0027],\n    answer: 1,\n    why: \u0027Esperar que a pessoa se adapte é integração. Inclusão é a empresa mudar o ambiente, as atitudes e os processos.\u0027,\n    topic: \u0027Pessoas com deficiência\u0027,\n    topicId: \u0027inclusao\u0027,\n  },\n];\n\nexport function Quiz() {\n  // chosen[i] = index of the option picked for question i (undefined = not answered yet)\n  const [chosen, setChosen] = useState\u003c(number | undefined)[]\u003e(() =\u003e QUESTIONS.map(() =\u003e undefined));\n  const answered = chosen.filter((c) =\u003e c !== undefined).length;\n  const score = chosen.filter((c, i) =\u003e c === QUESTIONS[i].answer).length;\n  const done = answered === QUESTIONS.length;\n\n  const pick = (qi: number, oi: number) =\u003e\n    setChosen((prev) =\u003e (prev[qi] !== undefined ? prev : prev.map((c, i) =\u003e (i === qi ? oi : c))));\n\n  return (\n    \u003cSection\n      id=\"quiz\"\n      number=\"Quiz\"\n      kicker=\"Teste seus conhecimentos\"\n      title=\"E aí, o que ficou?\"\n      intro=\"Responda as perguntas abaixo para ver o que você aprendeu. É um teste de conhecimentos, não um teste sobre a sua saúde: ele não avalia nem diagnostica ninguém.\"\n    \u003e\n      \u003cdiv className=\"sticky top-[72px] z-[3] -mx-2 mb-10 flex items-center justify-between gap-4 rounded-full border border-white/20 bg-black/50 px-5 py-3 backdrop-blur-xl sm:top-[84px]\"\u003e\n        \u003cspan className=\"text-[15px] text-white/80\"\u003e\n          {answered} de {QUESTIONS.length} respondidas\n        \u003c/span\u003e\n        \u003cspan className=\"text-[15px] text-white\"\u003e\n          Acertos: \u003cstrong\u003e{score}\u003c/strong\u003e\n        \u003c/span\u003e\n      \u003c/div\u003e\n\n      \u003col className=\"space-y-14\"\u003e\n        {QUESTIONS.map((item, qi) =\u003e {\n          const c = chosen[qi];\n          const isAnswered = c !== undefined;\n          const right = c === item.answer;\n          return (\n            \u003cReveal key={item.q}\u003e\n              \u003cli className=\"border-t border-white/30 pt-6\"\u003e\n                \u003cp className=\"text-[14px] text-white/50\"\u003e\n                  Pergunta {qi + 1} · {item.topic}\n                \u003c/p\u003e\n                \u003ch3 className=\"heading mt-2 text-[22px] leading-tight text-white sm:text-[28px]\"\u003e{item.q}\u003c/h3\u003e\n                \u003cdiv className=\"mt-6 flex flex-col items-start gap-3\"\u003e\n                  {item.options.map((opt, oi) =\u003e {\n                    const isCorrect = oi === item.answer;\n                    const isPicked = oi === c;\n                    let style = \u0027border-white/60 text-white hover:bg-white hover:text-black\u0027;\n                    if (isAnswered) {\n                      if (isCorrect) style = \u0027border-white bg-white text-black\u0027;\n                      else if (isPicked) style = \u0027border-white/40 text-white/60 line-through\u0027;\n                      else style = \u0027border-white/20 text-white/40\u0027;\n                    }\n                    return (\n                      \u003cbutton\n                        key={opt}\n                        type=\"button\"\n                        disabled={isAnswered}\n                        onClick={() =\u003e pick(qi, oi)}\n                        className={`${pill} !whitespace-normal text-left transition-colors duration-200 ${style} ${isAnswered ? \u0027cursor-default\u0027 : \u0027\u0027}`}\n                      \u003e\n                        \u003cspan className=\"mr-2 opacity-60\"\u003e{String.fromCharCode(65 + oi)}\u003c/span\u003e\n                        {opt}\n                      \u003c/button\u003e\n                    );\n                  })}\n                \u003c/div\u003e\n                {isAnswered \u0026\u0026 (\n                  \u003cdiv className=\"mt-6 max-w-2xl\" role=\"status\"\u003e\n                    \u003cTag variant={right ? \u0027solid\u0027 : \u0027outline\u0027}\u003e{right ? \u0027Acertou!\u0027 : \u0027Não foi dessa vez\u0027}\u003c/Tag\u003e\n                    \u003cp className=\"mt-3 text-[16px] lea
